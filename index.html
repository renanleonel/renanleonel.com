<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#097ca0" />
    <meta
      name="description"
      content="Renan Leonel. Portfolio, projects, and writing, inside an interactive macOS 27 desktop." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://renanleonel.com" />
    <meta property="og:title" content="Renan Leonel" />
    <meta
      property="og:description"
      content="Portfolio, projects, and writing, inside an interactive macOS 27 desktop." />
    <meta property="og:image" content="https://renanleonel.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Renan Leonel" />
    <meta
      name="twitter:description"
      content="Portfolio, projects, and writing, inside an interactive macOS 27 desktop." />
    <meta name="twitter:image" content="https://renanleonel.com/og-image.png" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a84ff'/%3E%3Cpath d='M32 0h18a14 14 0 0 1 14 14v36a14 14 0 0 1-14 14H32z' fill='%23a8dcff'/%3E%3Cpath d='M21 22v8m22-8v8M20 42c8 7 16 7 24 0M32 14v25' fill='none' stroke='%2314273a' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Renan Leonel</title>
    <link rel="canonical" href="https://renanleonel.com/" />
    <!--
      First paint: a static copy of the lock screen, styled inline, so the page
      shows the real first screen before any JavaScript or the main stylesheet
      arrives. React replaces it with the identical LoginScreen on mount; keep
      the two in sync (src/features/desktop/components/login-screen.tsx).
    -->
    <style>
      /*
        Inter is the desktop font on non-Apple platforms (Apple devices use San
        Francisco). The lock screen uses the system stack instead, so the first
        frame never waits on a font. The asset loader preloads Inter during the
        lock screen; `optional` then uses it if it is ready and otherwise keeps
        the system font for the visit, so desktop text never reflows.
      */
      @font-face {
        font-family: 'Inter Variable';
        font-style: normal;
        font-display: optional;
        font-weight: 100 900;
        src: url('/fonts/inter-latin-variable.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Inter Variable';
        font-style: normal;
        font-display: optional;
        font-weight: 100 900;
        src: url('/fonts/inter-latin-ext-variable.woff2') format('woff2');
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
          U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113,
          U+2C60-2C7F, U+A720-A7FF;
      }
      .static-lock {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        color: white;
        font-family:
          -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Segoe UI', Roboto,
          'Helvetica Neue', sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        text-shadow: 0 2px 12px oklch(0.08 0.03 245 / 0.4);
        background: oklch(0.36 0.09 231) center / cover no-repeat;
      }
      /* Added by the asset loader after first paint, so the photo never
         competes with the first frame. */
      .static-lock.has-wallpaper {
        background-image: url('/wallpaper-tahoe-day.jpg');
        background-image: image-set(
          url('/wallpaper-tahoe-day.avif') type('image/avif'),
          url('/wallpaper-tahoe-day.webp') type('image/webp'),
          url('/wallpaper-tahoe-day.jpg') type('image/jpeg')
        );
      }
      .static-lock::before {
        content: '';
        position: absolute;
        inset: 0;
        background: oklch(0.12 0.04 245 / 0.22);
        backdrop-filter: blur(11px) saturate(0.9);
        -webkit-backdrop-filter: blur(11px) saturate(0.9);
      }
      .static-lock > div {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .static-lock__time {
        margin-top: 12vh;
      }
      .static-lock__time span {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: oklch(1 0 0 / 0.86);
      }
      .static-lock__time strong {
        margin-top: 4px;
        font-size: clamp(5.5rem, 11vw, 9rem);
        line-height: 0.95;
        letter-spacing: -0.035em;
        font-weight: 600;
        color: oklch(1 0 0 / 0.9);
        font-variant-numeric: tabular-nums;
      }
      .static-lock__user {
        margin-top: auto;
        margin-bottom: 12vh;
      }
      .static-lock__user i {
        width: 72px;
        height: 72px;
        display: grid;
        place-items: center;
        margin-bottom: 10px;
        border-radius: 50%;
        font-size: 28px;
        font-style: normal;
        font-weight: 600;
        background: linear-gradient(180deg, oklch(0.79 0.17 70), oklch(0.6 0.18 35));
        box-shadow:
          inset 0 0 0 1px oklch(1 0 0 / 0.45),
          0 9px 28px oklch(0.08 0.03 245 / 0.25);
      }
      .static-lock__user strong {
        font-size: 15px;
        font-weight: 700;
      }
      .static-lock__user small {
        margin-top: 6px;
        font-size: 13px;
        color: oklch(1 0 0 / 0.75);
      }
      @media (max-width: 600px) {
        .static-lock__time span {
          font-size: 18px;
        }
      }
    </style>
  </head>
  <body class="w-full h-full m-0 overflow-hidden">
    <div
      id="root"
      class="w-full h-full m-0 overflow-hidden motion-reduce:[&,&_*]:scroll-auto! motion-reduce:[&,&_*]:[animation-duration:1ms]! motion-reduce:[&,&_*]:[animation-iteration-count:1]! motion-reduce:[&,&_*]:duration-[1ms]! motion-reduce:[&_*::before]:scroll-auto! motion-reduce:[&_*::before]:[animation-duration:1ms]! motion-reduce:[&_*::before]:[animation-iteration-count:1]! motion-reduce:[&_*::before]:duration-[1ms]! motion-reduce:[&_*::after]:scroll-auto! motion-reduce:[&_*::after]:[animation-duration:1ms]! motion-reduce:[&_*::after]:[animation-iteration-count:1]! motion-reduce:[&_*::after]:duration-[1ms]!">
      <div class="static-lock">
        <div class="static-lock__time">
          <span id="static-lock-date"></span>
          <strong id="static-lock-time"></strong>
        </div>
        <div class="static-lock__user">
          <i>R</i>
          <strong>Renan</strong>
          <small>Click to log in</small>
        </div>
      </div>
      <script>
        (function () {
          var now = new Date();
          document.getElementById('static-lock-date').textContent = now.toLocaleDateString(
            'en-US',
            { weekday: 'long', month: 'long', day: 'numeric' },
          );
          document.getElementById('static-lock-time').textContent = now
            .toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })
            .replace(/\s?[AP]M$/, '');
        })();
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
